name: Validate workflow contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate project workflow contracts
        run: python ci/validate-workflow-contracts.py --mode project

      - name: Run validator fixture tests
        run: python ci/tests/test_validator.py

      - name: Run project validator fixture tests
        run: python ci/tests/test_project_validator.py

      - name: Run folder map validation tests
        run: python ci/tests/test_folder_map_validation.py

      - name: Run CI validation mode tests
        run: python ci/tests/test_ci_validation_mode.py

      - name: Run product tests
        run: pytest

      - name: Lint product sources
        run: ruff check src tests
